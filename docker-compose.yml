services:

  postgres:
    image: postgres:17

    container_name: pos-postgres

    restart: always

    environment:
      POSTGRES_DB: posdb
      POSTGRES_USER: mapalo
      POSTGRES_PASSWORD: mapalo

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
