# Integration tests run against a separate PostgreSQL database (created by scripts/dev-db.sh),
# rebuilt from scratch on every test run.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/posdb_test}
spring.datasource.username=${DB_USERNAME:mapalo}
spring.datasource.password=${DB_PASSWORD:mapalo}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.devtools.restart.enabled=false

# The ZRA processor is driven explicitly by the tests.
pos.scheduling.enabled=false
pos.zra.enabled=true
pos.zra.retry-base-delay-seconds=1
pos.zra.max-attempts=3
pos.whatsapp.support-number=0971000111

# Tests build their own data; never load the demo set, whatever POS_SEED_DEMO is in the environment.
pos.seed.demo=false
