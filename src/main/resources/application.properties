spring.application.name=pos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/posdb}
spring.datasource.username=${DB_USERNAME:mapalo}
spring.datasource.password=${DB_PASSWORD:mapalo}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

server.port=${SERVER_PORT:8081}

# Low-bandwidth clients: gzip JSON/CSV/text responses larger than 1 KB.
server.compression.enabled=true
server.compression.mime-types=application/json,text/csv,text/plain,application/pdf
server.compression.min-response-size=1024

# CSV catalogue import uploads.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=500ms
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=build/classes/java/main

# ---------------------------------------------------------------------------
# POS application settings (see README "Configuration overrides")
# ---------------------------------------------------------------------------
pos.timezone=${POS_TIMEZONE:Africa/Lusaka}
pos.low-stock-threshold=${POS_LOW_STOCK_THRESHOLD:5}

# JWT signing secret (>= 32 bytes). Override JWT_SECRET in every non-local environment.
pos.jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123456}
pos.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ZRA Smart Invoice VSDC
pos.zra.enabled=${ZRA_ENABLED:false}
pos.zra.base-url=${ZRA_VSDC_BASE_URL:https://api-sandbox.zra.org.zm/vsdc-api/v1}
pos.zra.connect-timeout-seconds=${ZRA_CONNECT_TIMEOUT_SECONDS:10}
pos.zra.read-timeout-seconds=${ZRA_READ_TIMEOUT_SECONDS:30}
pos.zra.max-attempts=${ZRA_MAX_ATTEMPTS:10}
pos.zra.retry-base-delay-seconds=${ZRA_RETRY_BASE_DELAY_SECONDS:60}
pos.zra.retry-max-delay-seconds=${ZRA_RETRY_MAX_DELAY_SECONDS:3600}
pos.zra.batch-size=${ZRA_BATCH_SIZE:20}
pos.zra.processor-interval-ms=${ZRA_PROCESSOR_INTERVAL_MS:30000}
pos.zra.default-refund-reason-code=${ZRA_DEFAULT_REFUND_REASON_CODE:06}

# Offline sync
pos.sync.max-batch-size=${SYNC_MAX_BATCH_SIZE:100}
pos.sync.max-offline-age-days=${SYNC_MAX_OFFLINE_AGE_DAYS:60}
pos.sync.max-clock-skew-minutes=${SYNC_MAX_CLOCK_SKEW_MINUTES:10}

# End-of-day reconciliation: variance per tender tolerated before it is flagged
pos.reconciliation.variance-tolerance=${RECONCILIATION_VARIANCE_TOLERANCE:0.00}

# WhatsApp: NONE (wa.me click-to-chat links only), TWILIO or META (WhatsApp Cloud API)
pos.whatsapp.provider=${WHATSAPP_PROVIDER:NONE}
pos.whatsapp.support-number=${WHATSAPP_SUPPORT_NUMBER:}
pos.whatsapp.default-country-code=${WHATSAPP_DEFAULT_COUNTRY_CODE:260}
pos.whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
pos.whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
pos.whatsapp.twilio.from-number=${TWILIO_WHATSAPP_FROM:}
pos.whatsapp.meta.phone-number-id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID:}
pos.whatsapp.meta.access-token=${WHATSAPP_CLOUD_ACCESS_TOKEN:}
pos.whatsapp.meta.api-version=${WHATSAPP_CLOUD_API_VERSION:v21.0}

# Demo data: set POS_SEED_DEMO=true to load sample users, products and sales into an EMPTY database.
# Never enable in production (see README "Demo data").
pos.seed.demo=${POS_SEED_DEMO:true}
